name: Update Font Versions
on:
  schedule:
    - cron: "0 12 * * 0"
  workflow_dispatch:
  push:

jobs:
  update-versions:
    runs-on: ubuntu-latest

    container:
      image: yklab/pandoc-extra-ja:latest

    steps:
      - name: Update apt
        run: apt-get update

      - name: Check each package version
        id: check_versions
        shell: bash
        run: |
          # 更新があるパッケージを保存するための一時ファイル
          TEMP_FILE="$(mktemp)"
          trap 'rm -f "$TEMP_FILE"' EXIT
          : > "$TEMP_FILE"  # 中身をクリア

          # 各パッケージごとに Installed と Candidate バージョンを取得
          PACKAGES='fontconfig fonts-noto fonts-noto-cjk fonts-noto-cjk-extra'
          IFS=' ' read -r -a ARRAY <<< "$PACKAGES"
          for pkg in "${ARRAY[@]}"; do
            CURRENT_VERSION=$(apt-cache policy "$pkg" | grep 'Installed:' | awk '{print $2}')
            if [ $? -ne 0 ]; then
              echo "Error: Failed to get installed version for $pkg" >&2
              exit 1
            fi

            CANDIDATE_VERSION=$(apt-cache policy "$pkg" | grep 'Candidate:' | awk '{print $2}')
            if [ $? -ne 0 ]; then
              echo "Error: Failed to get candidate version for $pkg" >&2
              exit 1
            fi

            echo "Package: $pkg | Installed: $CURRENT_VERSION | Candidate: $CANDIDATE_VERSION"

            # Candidate が (none) でなく、かつ Installed と異なる場合は更新あり
            if [ "$CANDIDATE_VERSION" != "(none)" ] && [ "$CURRENT_VERSION" != "$CANDIDATE_VERSION" ]; then
              echo "$pkg,$CURRENT_VERSION,$CANDIDATE_VERSION" >> "$TEMP_FILE"
            fi
          done

          # GitHub Actions で次のステップに渡すために、更新があったかどうかステータスを出力
          if [ -s "$TEMP_FILE" ]; then
            echo "status=update_available" >> $GITHUB_OUTPUT
          else
            echo "status=no_update" >> $GITHUB_OUTPUT
          fi

      - name: Notify Slack if updates exist
        if: steps.check_versions.outputs.status == 'update_available'
        uses: rtCamp/action-slack-notify@v2
        with:
          args: |
            以下のパッケージに更新があります：
            $(cat "$TEMP_FILE" | while IFS=, read -r pkg current candidate; do
              echo "- $pkg: $current → $candidate"
            done)
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_TITLE: "フォントパッケージの更新が利用可能です"
          SLACK_COLOR: warning
